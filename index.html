<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   height=device-height,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no,
                   viewport-fit=cover">

    <title>BWR</title>

    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #000;
        }

        body {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            touch-action: none;
        }

        /* =========================================================
           FULL SCREEN
        ========================================================= */

        #unity-container {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            overflow: hidden;

            background: #000;
        }

        /* =========================================================
           UNITY CANVAS
           RISOLUZIONE NATIVA 1080x1920
        ========================================================= */

        #unity-canvas {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            display: block;

            margin: 0;
            padding: 0;

            border: 0;
            outline: none;

            background: #000;

            touch-action: none;
        }

        canvas {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        /* =========================================================
           LOADING SCREEN
        ========================================================= */

        #loading-screen {
            position: fixed;
            inset: 0;

            width: 100vw;
            height: 100vh;

            width: 100dvw;
            height: 100dvh;

            display: flex;

            justify-content: center;
            align-items: center;

            background: #000;

            z-index: 10;

            pointer-events: none;
        }

        #loading-content {
            width: min(90vw, 650px);

            text-align: center;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            margin: 0 auto;
            padding: 20px;
        }

        #loading-reaper {
            display: block;

            width: min(70vw, 360px);
            max-width: 100%;

            height: auto;

            object-fit: contain;

            margin: 0 auto 24px auto;
        }

        #loading-disclaimer {
            width: 100%;

            color: #fff;

            font-family: Arial, sans-serif;

            font-size: 22px;
            font-weight: normal;

            line-height: 1.5;

            text-align: center;

            margin: 0 0 22px 0;
        }

        #loading-disclaimer strong {
            display: block;

            color: #fff;

            font-size: 32px;
            font-weight: bold;

            line-height: 1.2;

            margin-bottom: 8px;
        }

        #loading-text {
            width: 100%;

            color: #fff;

            font-family: Arial, sans-serif;

            font-size: 20px;
            font-weight: bold;

            line-height: 1.3;

            text-align: center;

            margin: 0 0 14px 0;
        }

        #loading-bar-background {
            width: 100%;
            height: 12px;

            background: #222;

            border-radius: 10px;

            overflow: hidden;
        }

        #loading-bar {
            width: 0%;
            height: 100%;

            background: #fff;

            border-radius: 10px;

            transition: width 0.15s linear;
        }

        @media (max-width: 600px) {

            #loading-content {
                width: 92vw;
                padding: 15px;
            }

            #loading-reaper {
                width: min(65vw, 260px);
                margin-bottom: 18px;
            }

            #loading-disclaimer {
                font-size: 18px;
                line-height: 1.45;
                margin-bottom: 18px;
            }

            #loading-disclaimer strong {
                font-size: 27px;
                margin-bottom: 6px;
            }

            #loading-text {
                font-size: 17px;
                margin-bottom: 12px;
            }

            #loading-bar-background {
                height: 10px;
            }
        }

        @media (max-height: 600px) {

            #loading-content {
                padding: 10px;
            }

            #loading-reaper {
                width: min(45vh, 220px);
                margin-bottom: 12px;
            }

            #loading-disclaimer {
                font-size: 15px;
                line-height: 1.3;
                margin-bottom: 12px;
            }

            #loading-disclaimer strong {
                font-size: 22px;
                margin-bottom: 4px;
            }

            #loading-text {
                font-size: 14px;
                margin-bottom: 8px;
            }

            #loading-bar-background {
                height: 8px;
            }
        }
    </style>
</head>

<body>

    <div id="unity-container">

        <canvas
            id="unity-canvas"
            width="1080"
            height="1920"
            tabindex="-1">
        </canvas>

    </div>


    <div id="loading-screen">

        <div id="loading-content">

            <img
                id="loading-reaper"
                src="./Reaper.png"
                alt="Reaper">

            <div id="loading-disclaimer">

                <strong>ATTENTION!</strong>

                This game is currently in Early Access,
                so you may encounter bugs, glitches,
                and unfinished features.

            </div>

            <div id="loading-text">
                Loading...
            </div>

            <div id="loading-bar-background">
                <div id="loading-bar"></div>
            </div>

        </div>

    </div>


    <script>

        /* =========================================================
           UNITY CONFIG
        ========================================================= */

        const buildUrl = "Build";

        /*
         * CORRETTO:
         * I file presenti nella cartella Build sono:
         *
         * BL_Build.loader.js
         * BL_Build.data.br
         * BL_Build.framework.js.br
         * BL_Build.wasm.br
         */

        const loaderUrl =
            buildUrl + "/BL_Build.loader.js";

        const config = {

            dataUrl:
                buildUrl +
                "/BL_Build.data.br",

            frameworkUrl:
                buildUrl +
                "/BL_Build.framework.js.br",

            codeUrl:
                buildUrl +
                "/BL_Build.wasm.br",

            streamingAssetsUrl:
                "StreamingAssets",

            companyName:
                "BWR",

            productName:
                "BWR",

            productVersion:
                "0.1.0",

            /*
             * Unity usa il canvas a schermo intero.
             */
            matchWebGLToCanvasSize:
                true,

            /*
             * Limita il DPR per evitare un carico
             * eccessivo sui dispositivi mobili.
             */
            devicePixelRatio:
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                )
        };


        /* =========================================================
           ELEMENTI
        ========================================================= */

        const canvas =
            document.getElementById(
                "unity-canvas"
            );

        const loadingScreen =
            document.getElementById(
                "loading-screen"
            );

        const loadingBar =
            document.getElementById(
                "loading-bar"
            );

        const loadingText =
            document.getElementById(
                "loading-text"
            );

        let unityInstance = null;


        /* =========================================================
           FULL SCREEN RESIZE
        ========================================================= */

        function resizeGame() {

            const vw =
                window.visualViewport
                    ? window.visualViewport.width
                    : window.innerWidth;

            const vh =
                window.visualViewport
                    ? window.visualViewport.height
                    : window.innerHeight;

            if (!vw || !vh) {
                return;
            }

            /*
             * Il canvas occupa SEMPRE tutto lo schermo.
             *
             * La risoluzione interna rimane:
             *
             * 1080 x 1920
             *
             * Unity si occupa dello scaling.
             */

            canvas.style.width =
                vw + "px";

            canvas.style.height =
                vh + "px";

            canvas.style.left =
                "0px";

            canvas.style.top =
                "0px";
        }


        /* =========================================================
           RESIZE EVENTS
        ========================================================= */

        window.addEventListener(
            "resize",
            resizeGame,
            { passive: true }
        );

        window.addEventListener(
            "orientationchange",
            function () {

                setTimeout(
                    resizeGame,
                    150
                );

            },
            { passive: true }
        );

        if (window.visualViewport) {

            window.visualViewport.addEventListener(
                "resize",
                resizeGame,
                { passive: true }
            );
        }

        resizeGame();


        /* =========================================================
           CRAZYGAMES SDK
        ========================================================= */

        async function initCrazyGames() {

            try {

                if (
                    typeof CrazyGames !== "undefined" &&
                    CrazyGames.SDK
                ) {

                    await CrazyGames.SDK.init();

                    console.log(
                        "CrazyGames SDK initialized"
                    );
                }

            } catch (error) {

                console.warn(
                    "CrazyGames SDK:",
                    error
                );
            }
        }


        /* =========================================================
           GAMEPLAY START
        ========================================================= */

        function gameplayStart() {

            try {

                if (
                    typeof CrazyGames !== "undefined" &&
                    CrazyGames.SDK &&
                    CrazyGames.SDK.game
                ) {

                    CrazyGames.SDK.game.gameplayStart();
                }

            } catch (error) {

                console.warn(
                    "CrazyGames gameplayStart:",
                    error
                );
            }
        }


        /* =========================================================
           GAMEPLAY STOP
        ========================================================= */

        function gameplayStop() {

            try {

                if (
                    typeof CrazyGames !== "undefined" &&
                    CrazyGames.SDK &&
                    CrazyGames.SDK.game
                ) {

                    CrazyGames.SDK.game.gameplayStop();
                }

            } catch (error) {

                console.warn(
                    "CrazyGames gameplayStop:",
                    error
                );
            }
        }


        /* =========================================================
           REWARDED AD
        ========================================================= */

        async function showRewardedAd() {

            try {

                if (
                    typeof CrazyGames !== "undefined" &&
                    CrazyGames.SDK &&
                    CrazyGames.SDK.ad
                ) {

                    gameplayStop();

                    await CrazyGames.SDK.ad.requestAd(
                        "rewarded"
                    );

                    gameplayStart();

                    return true;
                }

            } catch (error) {

                console.warn(
                    "Rewarded ad:",
                    error
                );

                gameplayStart();
            }

            return false;
        }


        /* =========================================================
           MIDGAME AD
        ========================================================= */

        async function showMidgameAd() {

            try {

                if (
                    typeof CrazyGames !== "undefined" &&
                    CrazyGames.SDK &&
                    CrazyGames.SDK.ad
                ) {

                    gameplayStop();

                    await CrazyGames.SDK.ad.requestAd(
                        "midgame"
                    );

                    gameplayStart();

                    return true;
                }

            } catch (error) {

                console.warn(
                    "Midgame ad:",
                    error
                );

                gameplayStart();
            }

            return false;
        }


        /* =========================================================
           SALVATAGGIO
        ========================================================= */

        async function saveGame(
            key,
            value
        ) {

            try {

                if (
                    typeof CrazyGames !== "undefined" &&
                    CrazyGames.SDK &&
                    CrazyGames.SDK.data
                ) {

                    await CrazyGames.SDK.data.setItem(
                        key,
                        value
                    );

                    console.log(
                        "Saved:",
                        key
                    );

                    return true;
                }

            } catch (error) {

                console.warn(
                    "Save error:",
                    error
                );
            }

            return false;
        }


        /* =========================================================
           CARICAMENTO
        ========================================================= */

        async function loadGame(
            key
        ) {

            try {

                if (
                    typeof CrazyGames !== "undefined" &&
                    CrazyGames.SDK &&
                    CrazyGames.SDK.data
                ) {

                    return await CrazyGames.SDK.data.getItem(
                        key
                    );
                }

            } catch (error) {

                console.warn(
                    "Load error:",
                    error
                );
            }

            return null;
        }


        /* =========================================================
           BLOCCO SCROLL
        ========================================================= */

        document.addEventListener(
            "touchmove",
            function (event) {

                event.preventDefault();

            },
            { passive: false }
        );

        document.addEventListener(
            "wheel",
            function (event) {

                event.preventDefault();

            },
            { passive: false }
        );


        /* =========================================================
           CARICAMENTO UNITY
        ========================================================= */

        const script =
            document.createElement(
                "script"
            );

        script.src =
            loaderUrl;

        script.onload =
            function () {

                createUnityInstance(

                    canvas,

                    config,

                    function (progress) {

                        const percentage =
                            Math.round(
                                progress * 100
                            );

                        loadingBar.style.width =
                            percentage + "%";

                        loadingText.textContent =
                            "Loading " +
                            percentage +
                            "%";
                    }

                )

                .then(
                    function (instance) {

                        unityInstance =
                            instance;

                        resizeGame();

                        loadingScreen.style.display =
                            "none";

                        gameplayStart();

                        console.log(
                            "BWR Unity started successfully."
                        );
                    }
                )

                .catch(
                    function (message) {

                        console.error(
                            "UNITY ERROR:",
                            message
                        );

                        loadingText.textContent =
                            "Error while loading";

                        loadingBar.style.width =
                            "0%";
                    }
                );
            };


        script.onerror =
            function () {

                console.error(
                    "Unable to load:",
                    loaderUrl
                );

                loadingText.textContent =
                    "Error: Unable to load Unity";
            };


        document.body.appendChild(
            script
        );


        /* =========================================================
           AVVIO CRAZYGAMES
        ========================================================= */

        initCrazyGames();

    </script>

</body>
</html>
